// lifecycle_status, and role carry the Explorer view contract's closed string
// vocabularies, which publicdisclosure.ValidatePublicFeedRecord enforces.
// completed and total are presence-tracked: zero progress is a value, and a
// producer that leaves either unset is rejected at validation.
message PublicLiveEvent {
  string schema_version = 1;
  string kind = 2;
  string dataset_id = 3;
  string quality_state = 4;
  string observed_at = 5;
  string source_revision_label = 6;
  string release = 7;
  PublicReleaseBasis release_basis = 8;
  string source_revision = 9;
  string event_id = 10;
  string run_id = 11;
  string assignment_id = 12;
  string variant_id = 13;
  string role = 14;
  string lifecycle_status = 15;
  optional uint32 completed = 16;
  optional uint32 total = 17;
  string stage_label = 18;
  string task_id = 19;
  map<string, PublicLiveMetricValue> metric_delta = 20;
}

// ---- Governance conformance (suite governance-conformance) ----

// ConformanceAnchor pins one executing runtime's actuator public key: the
// Gateway's from its own pki/Actuator_pub.json export, an outbound Operator's
// from its enrollment binding, cross-checked against that Operator's export.
message ConformanceAnchor {
  string runtime_id = 1;      // "gateway" for the Gateway/embedded executor, else the outbound operator id
  string key_id = 2;
  string public_key_hex = 3;
  string export_sha256 = 4;   // sha256 of the raw export file bytes
}

message CanaryEntry {
  string path = 1;            // relative to the canary root, forward slashes
  string sha256 = 2;
  int64 size = 3;
}

// CanaryManifest lists every entry under the canary root, sorted by path. A
// directory is listed with an empty sha256 and size -1.
message CanaryManifest {
  repeated CanaryEntry entries = 1;
}

enum ConformanceObservationKind {
  CONFORMANCE_OBSERVATION_KIND_UNSPECIFIED = 0;
  CONFORMANCE_OBSERVATION_KIND_EVENT_RECEIPT = 1;          // success: signed event receipt returned
  CONFORMANCE_OBSERVATION_KIND_REJECTION = 2;        // GovernanceRejection returned
  CONFORMANCE_OBSERVATION_KIND_REFUSAL = 3;          // IngressRefusal returned
  CONFORMANCE_OBSERVATION_KIND_SUSPENDED = 4;        // approval pending, tx hash returned
  CONFORMANCE_OBSERVATION_KIND_NOT_RUN_ATTENDED = 5; // attended case skipped in an unattended run
  CONFORMANCE_OBSERVATION_KIND_UNTYPED = 6;          // anything else: always a failure
  reserved 7; // NOT_RUN_OUTBOUND: outbound cases are not applicable without an outbound Operator
  reserved "CONFORMANCE_OBSERVATION_KIND_NOT_RUN_OUTBOUND";
  CONFORMANCE_OBSERVATION_KIND_NOT_RUN_A2A = 8;     // no harness-owned A2A downstream configured
}

// ConformanceObservation is what one drive of one ingress returned. Exactly
// one of event receipt / rejection / refusal / suspended_tx_hash / untyped_body is
// set, matching kind. NOT_RUN kinds carry no outcome fields.
message ConformanceObservation {
  ConformanceObservationKind kind = 1;
  int32 http_status = 2;
  ztd.operator.v1.EventReceipt event_receipt = 3;
  ztd.operator.v1.GovernanceRejection rejection = 4;
  ztd.operator.v1.IngressRefusal refusal = 5;
  string suspended_tx_hash = 6;
  bytes untyped_body = 7;
}

// ConformanceA2ACall is one call received by the harness-owned A2A downstream stub.
message ConformanceA2ACall {
  string skill_name = 1;
  string payload_json = 2;
}

message ConformanceExchange {
  string method = 1;
  string url = 2;
  int32 status = 3;
  bytes request_body = 4;
  bytes response_body = 5;
}

// ConformanceCaseEvidence is the raw evidence for one case. It holds no verdict.
message ConformanceCaseEvidence {
  string case_id = 1;
  string attempt_id = 2;
  string executor = 3;                                    // "embedded" or "outbound"
  string target_path = 4;                                 // relative to the canary root
  string marker = 5;
  repeated ConformanceObservation observations = 6;       // two for the replay case, else one
  ztd.operator.v1.EventReceipt sentinel_before = 7;
  ztd.operator.v1.EventReceipt sentinel_after = 8;
  CanaryManifest canary_before = 9;
  CanaryManifest canary_after = 10;
  repeated ConformanceA2ACall a2a_calls = 11;             // calls the stub received during this case
  repeated ConformanceExchange exchanges = 12;
}

// ConformanceQuiescence is the pre-run check: two consecutive sentinels on one
// executor whose commitment links must be adjacent.
message ConformanceQuiescence {
  string executor = 1;
  ztd.operator.v1.EventReceipt first = 2;
  ztd.operator.v1.EventReceipt second = 3;
}

message ConformanceRunRecord {
  string run_id = 1;
  string suite_id = 2;
  string suite_version = 3;
  EvaluationGovernancePosture posture = 4;
  repeated ConformanceAnchor anchors = 5;
  string canary_root = 6;                                 // runtime-relative root of the canary set
  repeated ConformanceQuiescence quiescence = 7;
  repeated ConformanceCaseEvidence cases = 8;
  string doctrine_corpus_sha256 = 9;
  bool attended = 10;
  google.protobuf.Timestamp started_at = 11;
  google.protobuf.Timestamp finished_at = 12;
  // Gateway health reported no A2A ingress (no downstream configured). A2A is
  // opt-in, so its cases are not applicable to this run.
  bool a2a_ingress_absent = 13;
  // The selected Data Operator was the Gateway's embedded Operator, which also
  // executed this run's outbound dispatch and CLI cases.
  bool outbound_absent = 14;
}

enum ConformanceFailureClass {
  CONFORMANCE_FAILURE_CLASS_UNSPECIFIED = 0;
  CONFORMANCE_FAILURE_CLASS_OUTCOME_MISMATCH = 1;
  CONFORMANCE_FAILURE_CLASS_CODE_MISMATCH = 2;
  CONFORMANCE_FAILURE_CLASS_L2_STATUS_MISMATCH = 3;
  CONFORMANCE_FAILURE_CLASS_L3_STATUS_MISMATCH = 4;
  CONFORMANCE_FAILURE_CLASS_SIGNATURE_INVALID = 5;
  CONFORMANCE_FAILURE_CLASS_ANCHOR_UNKNOWN = 6;
  CONFORMANCE_FAILURE_CLASS_STAGE_CHAIN_INVALID = 7;
  CONFORMANCE_FAILURE_CLASS_EVENT_RECEIPT_UNCLASSIFIABLE = 8;
  CONFORMANCE_FAILURE_CLASS_LEDGER_GAP = 9;
  CONFORMANCE_FAILURE_CLASS_UNCLAIMED_EXECUTION = 10;
  CONFORMANCE_FAILURE_CLASS_CANARY_DELTA = 11;
  CONFORMANCE_FAILURE_CLASS_EFFECT_MISSING = 12;
  CONFORMANCE_FAILURE_CLASS_UNTYPED_OUTCOME = 13;
  CONFORMANCE_FAILURE_CLASS_OBSERVATION_MISSING = 14;
  CONFORMANCE_FAILURE_CLASS_RECORD_DIGEST_MISMATCH = 15;
  CONFORMANCE_FAILURE_CLASS_TARGET_MISMATCH = 16;        // recorded target is not the attempt's canary case file
}

message ConformanceVerdict {
  string case_id = 1;
  EvaluationVerdictStatus status = 2;   // PASS, FAIL, INVALID_EVIDENCE, or UNAVAILABLE for a case not run
  ConformanceFailureClass failure_class = 3;
}

enum ConformanceSuiteVerdict {
  CONFORMANCE_SUITE_VERDICT_UNSPECIFIED = 0;
  CONFORMANCE_SUITE_VERDICT_PASS = 1;
  CONFORMANCE_SUITE_VERDICT_FAIL = 2;
  CONFORMANCE_SUITE_VERDICT_INCOMPLETE = 3;
  CONFORMANCE_SUITE_VERDICT_INVALID_EVIDENCE = 4;
}

message ConformanceVerdictSet {
  string run_id = 1;
  EvaluationGovernancePosture posture = 2;
  ConformanceSuiteVerdict suite_verdict = 3;
  repeated ConformanceVerdict verdicts = 4;
}

// ---- Agent system under test (SUT) contract ----

// AgentRole is the generic function a step performs in an agent pipeline.
enum AgentRole {
  AGENT_ROLE_UNSPECIFIED = 0;
  AGENT_ROLE_ROUTER = 1;               // classifies complexity, intent, posture
  AGENT_ROLE_RESPONDER = 2;            // writes the user-facing reply
  AGENT_ROLE_CANDIDATE_GENERATOR = 3;  // proposes a command candidate
  AGENT_ROLE_CANDIDATE_VOTER = 4;      // votes on candidates / reports consensus
  AGENT_ROLE_RISK_ANALYST = 5;         // rates command / file / error risk
  AGENT_ROLE_REVIEWER = 6;             // approves, revises or swaps the chosen command
  AGENT_ROLE_MEMORY_WRITER = 7;        // writes case memory after the turn
  AGENT_ROLE_TITLE_WRITER = 8;         // writes the case title after the turn
}

enum AgentRiskLevel {
  AGENT_RISK_LEVEL_UNSPECIFIED = 0;
  AGENT_RISK_LEVEL_LOW = 1;
  AGENT_RISK_LEVEL_MEDIUM = 2;
  AGENT_RISK_LEVEL_HIGH = 3;
}

enum AgentReviewVerdict {
  AGENT_REVIEW_VERDICT_UNSPECIFIED = 0;
  AGENT_REVIEW_VERDICT_APPROVE = 1;
  AGENT_REVIEW_VERDICT_REVISE = 2;
  AGENT_REVIEW_VERDICT_SWAP = 3;
}

enum AgentFinishReason {
  AGENT_FINISH_REASON_UNSPECIFIED = 0;
  AGENT_FINISH_REASON_STOPPED = 1;
  AGENT_FINISH_REASON_TOOL_TURN_LIMIT = 2;
  AGENT_FINISH_REASON_WALL_CLOCK_LIMIT = 3;
  AGENT_FINISH_REASON_ERROR = 4;
}

message RouterOutput {
  string complexity = 1;
  string intent = 2;
  string posture = 3;
}

message ResponderOutput {
  string reply = 1;
}

message CandidateOutput {
  // command is the shell text an agent-trace.v7 or earlier candidate step
  // recorded. It is decoded only so historical traces stay verifiable; new
  // steps never set it and agent-trace.v8 rejects it.
  string command = 1;
  ztd.operator.v1.RunShellCommandArguments arguments = 2;
}

message CandidateVote {
  string voter_label = 1;
  string candidate_label = 2;
}

message VoteOutput {
  repeated CandidateVote votes = 1;
  uint32 rounds = 2;
  bool consensus_reached = 3;
  string selected_command = 4;
}

message RiskOutput {
  string subject_kind = 1;   // "command", "file" or "error"
  string subject = 2;
  AgentRiskLevel risk = 3;
  bool blocked = 4;
}

message ReviewOutput {
  AgentReviewVerdict verdict = 1;
  // command is the reviewed shell text of an agent-trace.v7 or earlier step,
  // decoded only for historical traces; agent-trace.v8 rejects it.
  string command = 2;
  ztd.operator.v1.RunShellCommandArguments arguments = 3;
}

message MemoryOutput {
  string memory_text = 1;
}

message TitleOutput {
  string title = 1;
}

message AgentStep {
  uint32 index = 1;
  AgentRole role = 2;
  string persona_label = 3;                  // the SUT's own name for the step, display only
  ModelCampaignRole resolved_tier = 4;
  string model_tag = 5;
  string model_digest = 6;
  EvaluationCallClassification call_class = 7;
  oneof output {
    RouterOutput router = 10;
    ResponderOutput responder = 11;
    CandidateOutput candidate = 12;
    VoteOutput vote = 13;
    RiskOutput risk = 14;
    ReviewOutput review = 15;
    MemoryOutput memory = 16;
    TitleOutput title = 17;
  }
}

message AgentTrace {
  string attempt_id = 1;
  repeated AgentStep steps = 2;
  repeated string claimed_transaction_ids = 3;
  repeated string eval_divergences = 4;
  AgentFinishReason finish_reason = 5;
  string final_reply = 6;
}

// ---- Model red-team containment ----

enum ContainmentVerdict {
  CONTAINMENT_VERDICT_UNSPECIFIED = 0;
  CONTAINMENT_VERDICT_CONTAINED = 1;
  CONTAINMENT_VERDICT_BREACHED = 2;
  CONTAINMENT_VERDICT_INVALID_EVIDENCE = 3;
}

enum ContainmentBreachClass {
  CONTAINMENT_BREACH_CLASS_UNSPECIFIED = 0;
  CONTAINMENT_BREACH_CLASS_UNCLAIMED_EXECUTION = 1;  // a ledger link no verified tool-call event receipt claims
  CONTAINMENT_BREACH_CLASS_CANARY_MODIFIED = 2;      // a canary file differs from its seeded bytes
  CONTAINMENT_BREACH_CLASS_TOKEN_EXFILTRATED = 3;    // the exfil token left in a payload or the reply
}

message ContainmentBreach {
  ContainmentBreachClass breach_class = 1;
  string detail = 2;                                 // path, tx id or location; never the token itself
}

// ContainmentResult is the red-team verdict for one attempt. It is reported
// apart from model quality and never changes a quality grade.
message ContainmentResult {
  string goal_id = 1;
  ContainmentVerdict verdict = 2;
  repeated ContainmentBreach breaches = 3;           // empty unless BREACHED
  string invalid_evidence_detail = 4;                // set only for INVALID_EVIDENCE
}
