  EVALUATION_MISSING_DATA_POLICY_UNSPECIFIED = 0;
  EVALUATION_MISSING_DATA_POLICY_FAIL = 1;
  EVALUATION_MISSING_DATA_POLICY_EXCLUDE = 2;
  EVALUATION_MISSING_DATA_POLICY_UNAVAILABLE = 3;
}

enum EvaluationMetricUnit {
  EVALUATION_METRIC_UNIT_UNSPECIFIED = 0;
  EVALUATION_METRIC_UNIT_COUNT = 1;
  EVALUATION_METRIC_UNIT_RATIO = 2;
}

message EvaluationRuntimeBoundary {
  EvaluationRuntimeComponent component = 1;
  string process_identity = 2;
  string runtime_namespace = 3;
  repeated string mounted_filesystems = 4;
  string persistent_store = 5;
  string endpoint = 6;
  string authenticated_identity = 7;
  string execution_owner_operator_id = 8;
}

message EvaluationDeploymentIdentity {
  string deployment_id = 1;
  ztd.compliance.v1.VersionedReference topology_ref = 2;
  repeated EvaluationRuntimeBoundary runtime_boundaries = 3;
  string controlled_target = 4;
  string independent_observer = 5;
}

message EvaluationValue {
  oneof value {
    bool boolean_value = 1;
    int64 integer_value = 2;
    string string_value = 3;
    ztd.compliance.v1.ComplianceEvidenceReference artifact_reference = 4;
  }
}

message EvaluationRun {
  string schema_version = 1;
  string run_id = 2;
  ztd.compliance.v1.VersionedReference suite_ref = 3;
  EvaluationDeploymentIdentity deployment = 4;
  // active_posture is the live Gateway posture, frozen at run start. The run
  // executes and resumes only under this posture.
  EvaluationGovernancePosture active_posture = 5;
  EvaluationLane lane = 6;
  string target_operator_id = 7;
  string target_operator_session_id = 8;
  google.protobuf.Timestamp started_at = 9;
  google.protobuf.Timestamp completed_at = 10;
  repeated string attempt_refs = 11;
  ztd.compliance.v1.ComplianceEvidenceReference final_verification_report_ref = 12;
  ModelCampaignBinding campaign_binding = 13;
  EvaluationWitnessPolicy provider_observation_policy = 14;
  EvaluationWitnessPolicy model_provenance_policy = 15;
  // consensus is the live Gateway's L2 consensus binding, frozen at run
  // start. Absent only on runs started before it existed; those never resume.
  EvaluationConsensusIdentity consensus = 16;
}

// EvaluationConsensusIdentity is the L2 consensus binding one run executes
// under. A run resumes only against the identical binding, so a rebind never
// mixes two vote producers or vote models in one run.
message EvaluationConsensusIdentity {
  bool bound = 1;
  string binding_id = 2;
  string provider = 3;
  string vote_kind = 4;
  string model_tag = 5;
  string model_digest = 6;
  uint32 quorum = 7;
  repeated string member_app_ids = 8;
  // binding_digest is the SHA-256 of the complete governing binding,
  // including the fields not projected above. Empty when unbound.
  string binding_digest = 9;
}

message EvaluationAttempt {
  string attempt_id = 1;
  string run_id = 2;
  ztd.compliance.v1.VersionedReference scenario_ref = 3;
  EvaluationAttemptStatus status = 4;
  google.protobuf.Timestamp started_at = 5;
  google.protobuf.Timestamp completed_at = 6;
  string transaction_id = 7;
  string execution_id = 8;
  repeated string observation_refs = 9;
  repeated string assertion_refs = 10;
  repeated string verdict_refs = 11;
  string failure_detail = 12;
}

message EvaluationObservation {
  string observation_id = 1;
  ztd.compliance.v1.VersionedReference observation_type = 2;
  EvaluationObservationSource source = 3;
  google.protobuf.Timestamp observed_at = 4;
  string run_id = 5;
  string scenario_id = 6;
  string attempt_id = 7;
  EvaluationEvidenceAuthority authority = 8;
  EvaluationValue value = 9;
  repeated ztd.compliance.v1.ComplianceEvidenceReference evidence_refs = 10;
}

message EvaluationTargetState {
  string schema_version = 1;
  string run_id = 2;
  string scenario_id = 3;
  string attempt_id = 4;
  string target_resource = 5;
  google.protobuf.Timestamp observed_at = 6;
  bool present = 7;
  bytes content = 8;
}

message EvaluationAssertion {
  string assertion_id = 1;
  string assertion_version = 2;
  EvaluationComparator comparator = 3;
  EvaluationValue expected = 4;
  repeated ztd.compliance.v1.VersionedReference required_observation_types = 5;
  repeated EvaluationEvidenceAuthority required_authorities = 6;
}

message EvaluationVerdict {
  string verdict_id = 1;
  ztd.compliance.v1.VersionedReference assertion_ref = 2;
  EvaluationVerdictStatus status = 3;
  repeated string observed_refs = 4;
  repeated ztd.compliance.v1.ComplianceEvidenceReference evidence_refs = 5;
  ztd.compliance.v1.VersionedReference grader_ref = 6;
  google.protobuf.Timestamp evaluated_at = 7;
  string failure_reason = 8;
}

message EvaluationMetric {
  string metric_id = 1;
  string metric_version = 2;
  int64 numerator = 3;
  int64 denominator = 4;
  double value = 5;
  EvaluationMetricUnit unit = 6;
  EvaluationMetricDirection direction = 7;
  ztd.compliance.v1.VersionedReference eligible_population_ref = 8;
  EvaluationMissingDataPolicy missing_data_policy = 9;
  repeated string source_verdict_refs = 10;
  repeated ztd.compliance.v1.ComplianceEvidenceReference evidence_refs = 11;
}

message EvaluationReport {
  string schema_version = 1;
  EvaluationRun run = 2;
  repeated EvaluationAttempt attempts = 3;
  repeated EvaluationObservation observations = 4;
  repeated EvaluationAssertion assertions = 5;
  repeated EvaluationVerdict verdicts = 6;
  repeated EvaluationMetric metrics = 7;
  repeated ztd.compliance.v1.ComplianceEvidenceReference evidence_refs = 8;
  reserved 9;
  reserved "verification_report";
  EvaluationVerdictStatus summary_status = 10;
  uint32 required_verdict_count = 11;
  uint32 passed_verdict_count = 12;
  string summary = 13;
  repeated EvaluationAssignmentResult assignment_results = 14;
  EvaluationVerificationReport campaign_verification_report = 15;
}

// ModelCampaignBinding pins immutable campaign identity on a run.
message ModelCampaignBinding {
  string campaign_id = 1;
  string campaign_digest = 2;
  ztd.compliance.v1.VersionedReference catalog_ref = 3;
  string catalog_digest = 4;
  string model_registry_digest = 5;
  string inference_operator_session_id = 6;
  string data_operator_session_id = 7;
}

// EvaluationCampaignSpec is the frozen private campaign definition.
message EvaluationCampaignSpec {
  string schema_version = 1;
  string campaign_id = 2;
  ztd.compliance.v1.VersionedReference catalog_ref = 3;
  string catalog_digest = 4;
  repeated ModelVariant model_registry = 5;
  string model_registry_digest = 6;
  string campaign_digest = 7;
  // governance_posture is set only on campaigns frozen before the posture
  // moved to the run (EvaluationRun.active_posture). New campaigns leave it
  // unspecified; a campaign runs under whatever posture each run freezes.
  EvaluationGovernancePosture governance_posture = 8;
  uint32 scenario_count = 9;
  uint32 repetition_count = 10;
  // platform_release is the ztd build version that froze the campaign. It is
  // part of campaign_digest, so a campaign cannot be re-labeled. Empty only
  // on campaigns frozen before v2.3.0; their release is an operator-asserted
  // tag held outside the digest.
  string platform_release = 11;
  // source_revision is the source commit of the build that froze the campaign.
  string source_revision = 12;
  // hold_context makes every repetition after the first continue the previous
  // repetition's investigation: the model receives that repetition's complete
  // conversation and works in the same workspace. Only set when
  // repetition_count > 1; false on campaigns frozen before it existed.
  bool hold_context = 13;
  // Investigation identity and its authoritative Data Operator are frozen
  // into campaign_digest. Absent only on legacy specs frozen before this field.
  EvaluationInvestigation investigation = 14;
  // Nonempty only for a system campaign. Binds the complete frozen catalog
  // formation set into campaign_digest, independently of later catalog edits.
  string formation_stack_set_digest = 15;
}

// EvaluationInvestigation declares the campaign's scored investigation scope.
// Persistent investigations require both a stable investigation_id and the
// stable identity (not session ID) of the Data Operator that owns its ledger.
message EvaluationInvestigation {
  EvaluationInvestigationMode mode = 1;
  string investigation_id = 2;
  string data_operator_id = 3;
}

// EvaluationScenarioCatalog is the immutable 25-scenario private catalog.
message EvaluationScenarioCatalog {
  string schema_version = 1;
  ztd.compliance.v1.VersionedReference catalog_ref = 2;
  string catalog_digest = 3;
  repeated EvaluationScenarioDefinition scenarios = 4;
}

message PublicScenarioCriterion {
  string criterion_id = 1;
  string public_label = 2;
  string public_description = 3;
  EvaluationGradingMethod grading_method = 4;
  bool required = 5;
}

message PublicToolScoreDimensionRequirement {
  PublicToolScoreDimension dimension = 1;
  bool required = 2;
}

// PromptHintArgument names one required argument of a hinted tool and where
// its value is derivable from. Values stay in the private input fixture.
message PromptHintArgument {
  string argument_name = 1;
  EvaluationHintArgumentSource source = 2;
  string tool_name = 3;
}

// PromptHint records which tools a scenario prompt hints at and where each
// required argument comes from, so a failure can say the opportunity was real.
message PromptHint {
  repeated string hinted_tools = 1;
  repeated PromptHintArgument arguments = 2;
}

// EvaluationScenarioDefinition describes one frozen typed scenario.
message EvaluationScenarioDefinition {
  string scenario_id = 1;
  string scenario_version = 2;
  EvaluationScenarioCategory category = 3;
  string public_description = 4;
  EvaluationGradingMethod grading_method = 5;
  repeated string allowed_tools = 6;
  repeated string expected_tools = 7;
  repeated string forbidden_tools = 8;
  ztd.compliance.v1.ComplianceEvidenceReference input_fixture_ref = 9;
  repeated string required_concepts = 10;
  ztd.compliance.v1.ComplianceEvidenceReference gold_criteria_ref = 11;
  repeated PublicScenarioCriterion public_criteria = 12;
  repeated PublicToolScoreDimensionRequirement public_tool_score_dimensions = 13;
  // eligible_roles lists the model roles that perform this task in the external
  // client. The homogeneous scheduler assigns the scenario only to these roles; the frozen
  // catalog digest binds the set.
  repeated ModelCampaignRole eligible_roles = 14;
  EvaluationTrajectoryPolicy trajectory_policy = 15;
  PromptHint prompt_hint = 16;
  // tribunal_commands routes run_shell_command through Tribunal authoring.
  // Unset, the model calls the native tool directly. The frozen catalog digest
  // binds the choice.
