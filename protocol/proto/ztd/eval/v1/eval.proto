  EVALUATION_SCENARIO_CATEGORY_SECURITY_POLICY = 7;
  EVALUATION_SCENARIO_CATEGORY_RECOVERY = 8;
  EVALUATION_SCENARIO_CATEGORY_FINAL_RESPONSE = 9;
  EVALUATION_SCENARIO_CATEGORY_CONTAINMENT = 10;
