package ztd.eval.v1;

option go_package = "github.com/zerotrustdata/ztd/protocol/proto/ztd/eval/v1;evalv1";

import "ztd/compliance/v1/compliance.proto";
import "ztd/operator/v1/operator.proto";
import "google/protobuf/timestamp.proto";

enum EvaluationLane {
  EVALUATION_LANE_UNSPECIFIED = 0;
  EVALUATION_LANE_PLATFORM = 1;
  EVALUATION_LANE_MODEL_ROLE = 2;
