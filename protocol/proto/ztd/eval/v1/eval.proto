  string served_model_tag = 4;
  string expected_model_digest = 5;
  string observed_model_digest = 6;
  string manifest_digest = 7;
  ModelManifestVerificationStatus manifest_verification_status = 8;
  repeated ModelWeightAttestation weight_attestations = 9;
  int64 attempt_started_at_unix_ms = 10;
  int64 attempt_completed_at_unix_ms = 11;
  int64 attested_at_unix_ms = 12;
  bool digest_match = 13;
  string attestation_digest = 14;
}

// ModelProvenanceObservationPhase identifies one lifecycle transition for a
