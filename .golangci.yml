version: "2"
run:
  allow-parallel-runners: true
  timeout: 5m
  tests: true
  build-tags:
    - integration
    - evalstack
linters:
  default: none
  enable:
    # Core Go checks (from official Go analysis framework)
    - govet
    - ineffassign
    - staticcheck
    - unused
    - errcheck
    
    # Style & Complexity (relaxed for gradual compliance)
    # - gocritic  # Disabled for gradual compliance (237 issues)
    # - goconst  # Disabled for gradual compliance (192 issues)
    - gocyclo
    - misspell
    - unconvert
    - whitespace
    - unparam
    
    # Bug Prevention
    - bodyclose
    - nilnesserr
    - durationcheck
    - reassign
    - makezero
    - sqlclosecheck
    - rowserrcheck
    - wastedassign
    - fatcontext
    - recvcheck
    - mirror
    - musttag
    # - contextcheck  # Disabled for gradual compliance (9 issues)
    - copyloopvar
    - usestdlibvars
    - nilerr
    - nolintlint
    - sloglint
    - gosec
    - forbidigo
    
    # Test helpers. paralleltest and tparallel cover Tier 1 only; integration,
    # evalstack, and e2e files are excluded below and must stay serial.
    - thelper
    - testifylint
    - paralleltest
    - tparallel
    
    # Performance
    # - prealloc  # Disabled for gradual compliance (6 issues)
  settings:
    forbidigo:
      forbid:
        # INV-FS-11: scratch lives under <repo>/.ztd/tmp via testutil.TempDir, never the OS temp dir.
        - pattern: ^os\.TempDir$
          msg: use testutil.TempDir in tests or fs.RuntimeFileService.MkdirTemp at runtime (INV-FS-11)
        - pattern: ^(t|b|tb|f)\.TempDir$
          msg: use testutil.TempDir(t) so test scratch stays under .ztd/tmp (INV-FS-11)
    gocritic:
      disabled-checks:
        - appendCombine
        - commentedOutCode
        - emptyStringTest
        - equalFold
        - ifElseChain
        - importShadow
        - newDeref
        - paramTypeCombine
        - ptrToRefParam
        - rangeValCopy
        - sloppyReassign
        - switchTrue
        - typeAssertChain
        - underef
        - unlambda
        - unnecessaryBlock
        - weakCond
      enabled-tags:
        - diagnostic
        - performance
        - experimental
        - style
        - opinionated
    gosec:
      excludes:
        - G104 # Unchecked errors (handled by errcheck)
        - G101 # False positives on constant names containing "key" / "token"
        - G204 # Subprocess exec with variable (common across CLI tools)
        - G306 # File permissions (covered by project Perm* constants)
        - G703 # Path traversal taint false positives
        - G107 # HTTP request URL taint false positives
        - G115 # Integer overflow conversion
    govet:
      disable:
        - fieldalignment
        - shadow
        - unusedwrite
      enable-all: true
    gocyclo:
      min-complexity: 60
    nolintlint:
      allow-unused: true
      require-explanation: false
      require-specific: true
    goconst:
      min-len: 5
      min-occurrences: 5
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
          - gocritic
          - gosec
          - unused
        path: _test\.go
      - linters:
          - gosec
        path: internal/cli/stream/proxy_command_unix\.go
        text: G702
      - linters:
          - recvcheck
        path: internal/constants/operator_capabilities\.go
      - linters:
          - bodyclose
        path: internal/testutil/pubsub\.go
        text: Dial
      - linters:
          - gosec
        path: internal/services/vault/vault_crypto\.go
        text: G115
      - linters:
          - gosec
        path: internal/cli/cmd/auth/auth_context\.go
        text: G117
      - linters:
          - whitespace
        path: _test\.go
      - linters:
          - goconst
        path: _test\.go
      - linters:
          - gocyclo
        path: internal/services/compliance/evidence/operational_importer\.go
      # Tier 2/3 and eval-stack tests stay serial (INV-TEST-RUN-04).
      # These files are compiled by lint's integration,evalstack tags, or only
      # by the e2e tag, and are not part of the Tier 1 unit suite.
      - linters:
          - paralleltest
          - tparallel
        path: (?:internal/certs/fetch_integration_test\.go|internal/cli/api/client_integration_test\.go|internal/cli/auth/app_enrollment_gateway_integration_test\.go|internal/cli/auth/app_enrollment_integration_test\.go|internal/cli/auth/approval_sse_test\.go|internal/cli/auth/client_integration_test\.go|internal/cli/auth/enrollment_client_http_integration_test\.go|internal/cli/auth/identity_and_helpers_integration_test\.go|internal/cli/auth/operator_integration_test\.go|internal/cli/auth/passkey_enrollment_registrar_test\.go|internal/cli/auth/passkey_enrollment_sse_test\.go|internal/cli/auth/passkey_enrollment_test\.go|internal/cli/auth/tribunal_consensus_signer_integration_test\.go|internal/cli/auth/trust_discovery_integration_test\.go|internal/cli/cmd/audit/audit_integration_test\.go|internal/cli/cmd/auth/approve_api_integration_test\.go|internal/cli/cmd/auth/approve_cli_integration_test\.go|internal/cli/cmd/auth/approve_integration_test\.go|internal/cli/cmd/auth/approve_slow_execution_integration_test\.go|internal/cli/cmd/compliance/compliance_report_real_stack_integration_test\.go|internal/cli/cmd/eval/backup_test\.go|internal/cli/cmd/eval/campaigns_integration_test\.go|internal/cli/cmd/eval/campaigns_release_integration_test\.go|internal/cli/cmd/eval/conformance_integration_test\.go|internal/cli/cmd/eval/main_integration_test\.go)$
