  operatorv1.InferenceDispatchRequest:
    properties:
      acting_app_id:
        description: Application that initiated the inference request.
        type: string
      assignment_id:
        type: string
      campaign_id:
        type: string
      case_id:
        description: Application context propagated from the chat turn.
        type: string
      cli_session_id:
        type: string
      context_limit:
        type: integer
      evaluation_attempt_id:
        type: string
      investigation_id:
        type: string
      keep_alive:
        description: Ollama keep-alive duration override (empty = use config default).
        type: string
      max_tokens:
        description: Maximum tokens to generate (0 = use backend default).
        type: integer
      messages:
        description: Ordered conversation turns sent to the Inference Node. The node
          validates and re-scrubs every data-bearing part before crossing the provider
          boundary.
        items:
          $ref: '#/definitions/operatorv1.InferenceMessage'
        type: array
      model:
        description: |-
          Requested provider model. A campaign Inference Operator accepts it only
          when the exact model and digest occur in the frozen registry committed by
          model_registry_digest; standard inference uses the configured role model.
        type: string
      model_digest:
        type: string
      model_registry:
        items:
          $ref: '#/definitions/operatorv1.InferenceModelVariant'
        type: array
      model_registry_digest:
        type: string
      parallel_tool_calls:
        type: boolean
      provider_attempt_id:
        type: string
      request_schema_version:
        type: string
      response_format:
        $ref: '#/definitions/operatorv1.InferenceResponseFormat'
      retry_count:
        description: Zero-based retry ordinal for this provider attempt.
        type: integer
      role:
        allOf:
        - $ref: '#/definitions/operatorv1.ModelRole'
        description: Chat-tier role for this request (primary, assistant, lite).
      run_id:
        type: string
      scenario_id:
        type: string
      seed:
        description: |-
          Optional deterministic generation seed forwarded to the provider when
          supported. Absent means use the provider default.
        type: integer
      stop_sequences:
        items:
          type: string
        type: array
      stream:
        description: |-
          When true, the Gateway forwards live InferenceProgressEvent telemetry
          to the caller while waiting for the authoritative terminal completion.
        type: boolean
      target_operator_session_id:
        description: |-
          Explicit Inference Node target. When empty, the gateway requires exactly
          one enrolled inference-capable operator for the requestor; zero or
          multiple matches are rejected.
        type: string
      task_id:
        type: string
      temperature:
        description: Generation temperature override (0 = use backend default).
        type: number
      thinking:
        $ref: '#/definitions/operatorv1.InferenceThinkingControl'
      tool_choice:
        $ref: '#/definitions/operatorv1.InferenceToolChoice'
      tools:
        description: Ordered callable function declarations available to the model.
        items:
          $ref: '#/definitions/operatorv1.InferenceToolDeclaration'
        type: array
      top_k:
        type: integer
      top_p:
        type: number
      web_session_id:
        type: string
    type: object
  operatorv1.InferenceDispatchResponse:
    properties:
      observation_receipts:
        description: |-
          The observers' verified final signed receipts for this attempt's
          provider-boundary and model provenance BEGIN and FINALIZE commands, in
          dispatch order. Each was signed before the response was returned, so a
          trace bracket closing after the dispatch can claim its commitment.
        items:
          $ref: '#/definitions/operatorv1.ActionReceipt'
        type: array
      receipt:
        allOf:
        - $ref: '#/definitions/operatorv1.ActionReceipt'
        description: The verified final signed ActionReceipt for the transaction.
      result:
        allOf:
        - $ref: '#/definitions/operatorv1.InferenceResult'
        description: |-
          The complete inference result whose result_digest is bound into the
          signed receipt.
      transaction_id:
        description: Transaction ID correlating the dispatch with the audit chain.
        type: string
    type: object
