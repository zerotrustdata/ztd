  /api/v1/sse/events:
    get:
      description: |-
        Returns one page of stored SSE events after a given ID, for backfill; live delivery uses /api/v1/sse/stream. Dual auth: mTLS for CLI/operator, web session
        cookie for browser. The route is built entirely from auth context: user_id from
        cert/cookie, session from header/cookie. The query string carries only since_id and limit.
      parameters:
      - description: CLI session ID (mTLS only — user_id derived from cert)
        in: header
        name: X-ZTD-CLI-Session-ID
        type: string
      - description: Return events after this ID
        in: query
        name: since_id
        type: integer
      - description: Maximum events to return
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.SSEEventsResponse'
        "400":
          description: Bad Request
          schema:
            type: string
        "403":
          description: Forbidden — unauthorized
          schema:
            type: string
      summary: List stored SSE events
      tags:
      - telemetry
  /api/v1/sse/stream:
    get:
      description: |-
        Streams events via Server-Sent Events (text/event-stream). Dual auth: mTLS for
        CLI/operator, web session cookie for browser. Supports Last-Event-ID header for
        reconnection. The route is built entirely from auth context: user_id from cert/cookie,
        session from header/cookie. The query string carries only since_id.
      parameters:
      - description: CLI session ID (mTLS only — user_id derived from cert)
        in: header
        name: X-ZTD-CLI-Session-ID
        type: string
      - description: Replay events after this ID
        in: query
        name: since_id
        type: integer
      produces:
      - text/event-stream
      responses:
        "200":
          description: SSE stream
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            type: string
        "403":
          description: Forbidden — unauthorized
          schema:
            type: string
      summary: Stream SSE events
      tags:
      - telemetry
