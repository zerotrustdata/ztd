  /api/v1/operators/commands:
    post:
      consumes:
      - application/json
      description: |-
        Constructs a governed envelope for the target Operator session, waits for the
        terminal result and the Operator's verified final receipt, and returns both.
        Under ratify or notary posture a mutation is suspended and the request stays open
        until a human approves or denies it, up to the approval TTL, in addition to the
        dispatch deadline; clients allow both. The Gateway never mints the approval proof.
      parameters:
      - description: Dispatch request (JSON)
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.OperatorCommandRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Terminal result with the verified final ActionReceipt
          schema:
            $ref: '#/definitions/operatorv1.GovernedDispatchResult'
        "400":
          description: Bad Request — malformed request or unknown event type
          schema:
            $ref: '#/definitions/operatorv1.IngressRefusal'
        "403":
          description: Forbidden — GovernanceRejection carrying the signed L4 receipt;
            IngressRefusal when refused before L4
          schema:
            $ref: '#/definitions/operatorv1.GovernanceRejection'
        "404":
          description: Not Found — target operator session does not resolve
          schema:
            $ref: '#/definitions/operatorv1.IngressRefusal'
        "405":
          description: Method Not Allowed
          schema:
            $ref: '#/definitions/operatorv1.IngressRefusal'
        "422":
          description: Unprocessable Entity — target cannot run the command
          schema:
            $ref: '#/definitions/operatorv1.IngressRefusal'
        "503":
          description: Service Unavailable — GovernanceRejection or IngressRefusal,
            per the failing check
          schema:
            $ref: '#/definitions/operatorv1.GovernanceRejection'
        "504":
          description: Gateway Timeout — no terminal result and receipt before the
            deadline
          schema:
            $ref: '#/definitions/operatorv1.IngressRefusal'
      summary: Dispatch governed operator command
      tags:
      - operators
  /api/v1/operators/intents:
    post:
      consumes:
      - application/json
      description: |-
        Platform-internal endpoint (mTLS, app workload). The Gateway's Tribunal turns a
        plain-language command intent into one audited shell command through governed
        inference, then dispatches it to the target Operator as an ordinary governed
        EXECUTE_BASH. Under ratify or notary posture the command dispatch is suspended
        until a human approves or denies it. The Gateway never mints the approval proof.
      parameters:
      - description: Command intent and member inference template
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/tribunalv1.TribunalIntentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Deliberation record and, for an approved command, its governed
            outcome
          schema:
            $ref: '#/definitions/tribunalv1.TribunalIntentResult'
        "400":
          description: Bad Request — malformed body, missing field, or a member template
            that sets a Gateway-owned field
          schema:
            $ref: '#/definitions/operatorv1.IngressRefusal'
        "401":
          description: Unauthorized — missing delegated user identity
          schema:
            $ref: '#/definitions/operatorv1.IngressRefusal'
        "403":
          description: Forbidden — not an app workload
          schema:
            $ref: '#/definitions/operatorv1.IngressRefusal'
        "405":
          description: Method Not Allowed
          schema:
            $ref: '#/definitions/operatorv1.IngressRefusal'
        "413":
          description: Request Entity Too Large — body exceeds the payload limit
          schema:
            $ref: '#/definitions/operatorv1.IngressRefusal'
      summary: Deliberate and dispatch a command intent
      tags:
      - operators
  /api/v1/operators/validate:
    post:
      consumes:
      - application/json
      description: Validates the exact active operator-session, CLI-session, and user
        binding. The Gateway is authoritative; callers authenticate with an enrolled
        application mTLS certificate.
