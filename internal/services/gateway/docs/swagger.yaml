  evalv1.AgentRole:
    enum:
    - 0
    - 1
    - 2
    - 3
    - 4
    - 5
    - 6
    - 7
    - 8
    format: int32
    type: integer
    x-enum-comments:
      AgentRole_AGENT_ROLE_CANDIDATE_GENERATOR: proposes a command candidate
      AgentRole_AGENT_ROLE_CANDIDATE_VOTER: votes on candidates / reports consensus
      AgentRole_AGENT_ROLE_MEMORY_WRITER: writes case memory after the turn
      AgentRole_AGENT_ROLE_RESPONDER: writes the user-facing reply
      AgentRole_AGENT_ROLE_REVIEWER: approves, revises or swaps the chosen command
      AgentRole_AGENT_ROLE_RISK_ANALYST: rates command / file / error risk
      AgentRole_AGENT_ROLE_ROUTER: classifies complexity, intent, posture
      AgentRole_AGENT_ROLE_TITLE_WRITER: writes the case title after the turn
    x-enum-descriptions:
    - ""
    - classifies complexity, intent, posture
    - writes the user-facing reply
    - proposes a command candidate
    - votes on candidates / reports consensus
    - rates command / file / error risk
    - approves, revises or swaps the chosen command
    - writes case memory after the turn
    - writes the case title after the turn
    x-enum-varnames:
    - AgentRole_AGENT_ROLE_UNSPECIFIED
    - AgentRole_AGENT_ROLE_ROUTER
    - AgentRole_AGENT_ROLE_RESPONDER
    - AgentRole_AGENT_ROLE_CANDIDATE_GENERATOR
    - AgentRole_AGENT_ROLE_CANDIDATE_VOTER
    - AgentRole_AGENT_ROLE_RISK_ANALYST
    - AgentRole_AGENT_ROLE_REVIEWER
    - AgentRole_AGENT_ROLE_MEMORY_WRITER
    - AgentRole_AGENT_ROLE_TITLE_WRITER
