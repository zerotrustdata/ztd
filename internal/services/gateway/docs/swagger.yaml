  operatorv1.ActionReceipt:
    properties:
      action_type:
        description: The registry-derived governance class for the request event.
        type: string
      deterministic_stage_evidence:
        items:
          $ref: '#/definitions/operatorv1.DeterministicStageEvidence'
        type: array
      event_type:
        description: The semantic request event that produced this receipt.
        type: string
      executed_at_unix_ms:
        description: Timestamp when execution finished
        type: integer
      failure_code:
        allOf:
        - $ref: '#/definitions/operatorv1.ReceiptFailureCode'
        description: |-
          Typed classification of a FAILED receipt. UNSPECIFIED on non-failed
          receipts. Bound into the signature via canonicalization.
      final_persistence_attestation:
        $ref: '#/definitions/operatorv1.ReceiptPersistenceAttestation'
      l2_status:
        allOf:
        - $ref: '#/definitions/operatorv1.L2Status'
        description: |-
          Status of L2 (Consensus) signature verification.
          Distinguishes between "not required" vs "required but failed" for compliance.
      l3_status:
        allOf:
        - $ref: '#/definitions/operatorv1.L3Status'
        description: |-
          Status of L3 (Notary/Human) proof verification.
          Distinguishes between "not required" vs "required but failed" for compliance.
      rejection_code:
        allOf:
        - $ref: '#/definitions/operatorv1.GovernanceRejectionCode'
        description: |-
          The verification check that rejected the transaction. Set exactly when
          failure_code is GOVERNANCE_REJECTED; UNSPECIFIED otherwise. Bound into the
          signature via canonicalization.
      result_summary:
        description: Concise summary of the result (e.g. "exit code 0", "file written")
        type: string
      signature:
        description: ED25519 signature over the canonical receipt fields and deterministic
          stage evidence hash.
        type: string
      signer_key_id:
        description: ID of the Warden's signing key
        type: string
      state_root_after:
        description: State root after execution
        type: string
      state_root_before:
        description: State root before execution
        type: string
      status:
        allOf:
        - $ref: '#/definitions/operatorv1.ExecutionStatus'
        description: Final execution status
      transaction_hash:
        description: Original GovernanceEnvelope hash
        type: string
      transaction_id:
        description: Original GovernanceEnvelope ID
        type: string
    type: object
