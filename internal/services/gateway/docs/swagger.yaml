        description: member_calls are the governed member inferences, in order.
        items:
          $ref: '#/definitions/tribunalv1.TribunalMemberCall'
        type: array
      outcome:
        $ref: '#/definitions/tribunalv1.TribunalOutcome'
      risk_feedback:
        type: string
      risk_rationale:
        description: Marshal's rationale and feedback for a BLOCKED outcome.
        type: string
      steps:
        description: steps are the persona steps of the deliberation, in order.
        items:
          $ref: '#/definitions/evalv1.AgentStep'
        type: array
    type: object
  tribunalv1.TribunalMemberCall:
    properties:
      failure:
        allOf:
        - $ref: '#/definitions/operatorv1.InferenceDispatchFailure'
        description: failure is set on a call that did not complete.
      observation_receipts:
        description: |-
          observation_receipts are the observers' signed final receipts for the
          call's BEGIN and FINALIZE commands (InferenceDispatchResponse field 4).
        items:
          $ref: '#/definitions/operatorv1.ActionReceipt'
        type: array
      persona:
        type: string
      provider_attempt_id:
        type: string
      receipt:
        allOf:
        - $ref: '#/definitions/operatorv1.ActionReceipt'
        description: receipt is the Inference Operator's signed final ActionReceipt.
      result:
        allOf:
        - $ref: '#/definitions/operatorv1.InferenceResult'
        description: result is the complete verified InferenceResult of a completed
          call.
      round:
        type: integer
      stage:
        $ref: '#/definitions/tribunalv1.TribunalStage'
      transaction_id:
        type: string
    type: object
  tribunalv1.TribunalOutcome:
    enum:
    - 0
    - 1
    - 2
    - 3
    - 4
    - 5
    format: int32
    type: integer
    x-enum-varnames:
    - TribunalOutcome_TRIBUNAL_OUTCOME_UNSPECIFIED
    - TribunalOutcome_TRIBUNAL_OUTCOME_APPROVED
    - TribunalOutcome_TRIBUNAL_OUTCOME_NO_CONSENSUS
    - TribunalOutcome_TRIBUNAL_OUTCOME_BLOCKED
    - TribunalOutcome_TRIBUNAL_OUTCOME_AUDIT_FAILED
    - TribunalOutcome_TRIBUNAL_OUTCOME_INFERENCE_FAILED
  tribunalv1.TribunalStage:
    enum:
    - 0
    - 1
    - 2
    - 3
    format: int32
    type: integer
    x-enum-varnames:
    - TribunalStage_TRIBUNAL_STAGE_UNSPECIFIED
    - TribunalStage_TRIBUNAL_STAGE_GENERATE
    - TribunalStage_TRIBUNAL_STAGE_MARSHAL
    - TribunalStage_TRIBUNAL_STAGE_AUDIT
info:
  contact: {}
paths:
  /:
    get:
      consumes:
      - text/html
      description: Returns the public landing page for the gateway
      produces:
      - text/html
      responses:
        "200":
          description: OK
          schema:
            type: string
      summary: Landing page
      tags:
      - public
  /.well-known/ztd/bin/{filename}:
    get:
      description: Downloads the ztd binary file binary for the current platform (internal
        endpoint)
      produces:
      - application/octet-stream
      responses:
        "200":
          description: OK
          schema:
            type: file
      summary: Download ztd binary
      tags:
      - bootstrap
  /.well-known/ztd/pki/ca-bundle:
    get:
      consumes:
      - application/json
      description: Returns the platform's root CA certificate bundle for trust establishment
      produces:
      - application/x-pem-file
      responses:
        "200":
          description: OK
          schema:
            type: string
      summary: Get CA bundle
      tags:
      - pki
  /.well-known/ztd/pki/crl:
    get:
      consumes:
      - application/json
      description: Returns the certificate revocation list
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get CRL
      tags:
      - pki
  /.well-known/ztd/pki/fingerprint:
    get:
      consumes:
      - application/json
      description: Returns the platform's PKI fingerprint for verification
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get PKI fingerprint
      tags:
      - pki
  /api/v1/approvals:
    get:
      description: Lists suspended transactions pending L3 passkey approval for the
        authenticated user.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.SuspendedTransactionsResponse'
        "401":
          description: Unauthorized
          schema:
            type: string
      summary: List pending approvals
      tags:
      - approvals
  /api/v1/approvals/{txHash}/challenge:
    get:
      description: Generates a WebAuthn assertion challenge for approving a suspended
        transaction.
      parameters:
      - description: Transaction hash
        in: path
        name: txHash
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: WebAuthn assertion options
          schema:
            items:
              type: integer
            type: array
        "403":
          description: Forbidden — belongs to another user
          schema:
            type: string
        "404":
          description: Transaction not found or expired
          schema:
            type: string
      summary: Get approval challenge
      tags:
      - approvals
  /api/v1/approvals/{txHash}/verify:
    post:
      consumes:
      - application/json
      description: |-
        Verifies a WebAuthn assertion response to approve a suspended transaction. On success,
        the transaction resumes execution with the L3 proof attached and an SSE event is emitted.
      parameters:
      - description: Transaction hash
        in: path
        name: txHash
        required: true
        type: string
      - description: WebAuthn assertion response
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.WebAuthnAssertionResponse'
      produces:
      - application/json
      responses:
        "200":
          description: Canonical protojson ActionReceipt
          schema:
            $ref: '#/definitions/operatorv1.ActionReceipt'
        "403":
          description: Forbidden — verification failed
          schema:
            type: string
        "404":
          description: Transaction not found or expired
          schema:
            type: string
        "503":
          description: Service Unavailable — runtime vault locked; the proof can be
            resubmitted
          schema:
            type: string
      summary: Verify approval
      tags:
      - approvals
  /api/v1/approvals/respond:
    post:
      consumes:
      - application/json
      description: |-
        Denies a suspended transaction owned by the caller, or approves it with a CLI certificate signature.
        CLI approval requires mTLS and cli_signature over the domain-separated transaction hash using the enrolled P-256 key.
        The Gateway takes the certificate and chain hints from the mTLS connection. For an outbound Operator target the
        Gateway checks the active user, CLI session and revocation, then forwards the original proof for the Operator to
        re-verify against its pinned Gateway CA. If a governed dispatch is waiting on the transaction, the request returns after
        that dispatch completes, so clients allow the approval TTL plus the dispatch deadline.
        The envelope is re-submitted to its executing
        Operator with the L3 deny marker, so L4 rejects it with `GOVERNANCE_REJECTION_CODE_L3_DENIED` and
        L5 signs the rejection receipt. The receipt is returned and published as `approval.completed` to
        the CLI session that submitted the transaction. Under ratify or notary posture a CLI caller must
        present an mTLS client certificate and a web caller must hold a registered passkey.
        Browser approval requires a WebAuthn assertion through `/api/v1/approvals/{txHash}/verify`.
      parameters:
      - description: Approval decision
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.ApprovalRespondRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 'Canonical protojson ActionReceipt: the signed GOVERNANCE_REJECTED
            receipt of a deny, or the executing Operator''s signed receipt of an approval'
          schema:
            $ref: '#/definitions/operatorv1.ActionReceipt'
        "400":
          description: Invalid request body
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "403":
          description: Forbidden — approval requested, session not grounded for posture,
            or transaction belongs to another user
          schema:
            type: string
        "404":
          description: Transaction not found or expired
          schema:
            type: string
        "500":
          description: The deny produced no signed rejection receipt
          schema:
            type: string
        "503":
          description: Service Unavailable — runtime vault locked; the deny can be
            resubmitted
          schema:
            type: string
      summary: Approve or deny a suspended transaction
      tags:
      - approvals
  /api/v1/audit/receipts:
    get:
      description: Returns one canonical protojson ActionReceipt when tx_id is set
        or when investigation_id and action_type uniquely correlate a receipt. Without
        those selectors, returns searchable receipt records with the complete receipt
        nested under action_receipt.
      parameters:
      - description: Transaction ID for a single canonical ActionReceipt
        in: query
        name: tx_id
        type: string
      - description: Investigation ID for a unique correlation lookup
        in: query
        name: investigation_id
        type: string
      - description: Action type required with investigation_id
        in: query
        name: action_type
        type: string
      - description: Acting app identity filter
        in: query
        name: acting_app_id
        type: string
      - description: Operator session filter for list results
        in: query
        name: operator_session_id
        type: string
      - description: Maximum list results
        in: query
        name: limit
        type: integer
      - description: List offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: List wrapper; unique selectors instead return a bare operatorv1.ActionReceipt
          schema:
            $ref: '#/definitions/models.AuditReceiptsResponse'
        "400":
          description: Bad Request — conflicting or incomplete selectors
          schema:
            type: string
        "404":
          description: Receipt not found
          schema:
            type: string
        "405":
          description: Method Not Allowed
          schema:
            type: string
        "409":
          description: Conflict — correlation matched multiple receipts
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
        "503":
          description: Service Unavailable — egress scrubber unavailable, content
            withheld
          schema:
            type: string
      summary: Get or list audit receipts
      tags:
      - audit
  /api/v1/audit/receipts/export:
    get:
      description: Returns an AuditReceiptsResponse list wrapper. Every searchable
        record embeds the complete canonical protojson receipt under action_receipt.
      parameters:
      - description: Inclusive receipt timestamp in RFC3339 format
        in: query
        name: since
        type: string
      - description: Acting app identity filter
        in: query
        name: acting_app_id
        type: string
      - description: Operator session filter
        in: query
        name: operator_session_id
        type: string
      - description: Maximum results
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.AuditReceiptsResponse'
        "405":
          description: Method Not Allowed
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
        "503":
          description: Service Unavailable — egress scrubber unavailable, content
            withheld
          schema:
            type: string
      summary: Export audit receipts
      tags:
      - audit
  /api/v1/auth/logout:
    post:
      description: Clears the web session cookie and deletes the session from the
        database.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.StatusResponse'
      summary: Logout
      tags:
      - auth
  /api/v1/auth/passkeys:
    get:
      consumes:
      - application/json
      description: Lists all WebAuthn credentials for the authenticated user. Identity
        comes from the auth context.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.PasskeyCredentialsResponse'
      summary: List passkey credentials
      tags:
      - passkey
  /api/v1/auth/passkeys/{id}:
    delete:
      consumes:
      - application/json
      description: Revokes a WebAuthn credential by ID. Identity comes from the auth
        context.
      parameters:
      - description: Credential ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.PasskeyRevokeResponse'
        "409":
          description: Conflict — credential is the user's last passkey
          schema:
            type: string
      summary: Revoke passkey credential
      tags:
      - passkey
  /api/v1/auth/passkeys/authenticate/challenge:
    post:
      consumes:
      - application/json
      description: |-
        Generates a WebAuthn authentication challenge. Config-driven trust posture:
        mTLS (session-user binding), CLI bootstrap (public), or console (public).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.PasskeyChallengeResponse'
      summary: Generate WebAuthn authentication challenge
      tags:
      - passkey
  /api/v1/auth/passkeys/authenticate/verify:
    post:
      consumes:
      - application/json
      description: |-
        Verifies a WebAuthn assertion response. Config-driven trust posture:
        mTLS (session-user binding, may mint web session in body), CLI bootstrap (public), or console (public, may mint web session + cookie).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.PasskeyAuthVerifyResponse'
      summary: Verify WebAuthn authentication
      tags:
      - passkey
  /api/v1/auth/passkeys/cli/status:
    get:
      consumes:
      - application/json
      description: Returns the passkey credential list for the mTLS-authenticated
        user. Identity comes from the mTLS auth context; user_id query params are
        ignored.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.PasskeyCredentialsResponse'
      summary: CLI passkey status
      tags:
      - passkey
  /api/v1/auth/passkeys/register/challenge:
    post:
      consumes:
      - application/json
      description: |-
        Generates a WebAuthn registration challenge. Config-driven trust posture:
        mTLS (session-user binding), JIT (first-credential-only), CLI bootstrap (public), console (public, may auto-create user),
        or enrollment-token (public, token-gated — the CLI enrollment flow).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.PasskeyRegisterChallengeResponse'
      summary: Generate WebAuthn registration challenge
      tags:
      - passkey
  /api/v1/auth/passkeys/register/verify:
    post:
      consumes:
      - application/json
      description: |-
        Verifies a WebAuthn attestation response and stores the credential. Config-driven trust posture:
        mTLS (session-user binding), JIT (first-credential-only), CLI bootstrap (public), console (public, may mint web session + cookie),
        or enrollment-token (public, token-gated — the CLI enrollment flow).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.PasskeyVerifyResponse'
      summary: Verify WebAuthn registration
      tags:
      - passkey
  /api/v1/auth/platform-enrollments/request:
    post:
      consumes:
      - application/json
      description: The requester supplies its SHA-256 token hash. Resubmitting the
        same hash and CSRs recovers the same live request; token conflicts return
        409.
      parameters:
      - description: Enrollment request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.PlatformEnrollmentCreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.PlatformEnrollmentCreateResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create or recover a platform enrollment request
      tags:
      - Platform enrollment
  /api/v1/auth/sessions/me:
    get:
      description: Returns the authenticated user's ID and web session ID from the
        session cookie.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.WebSessionResponse'
        "401":
          description: Unauthorized
          schema:
            type: string
      summary: Get current web session
      tags:
      - auth
  /api/v1/data/blobs/{namespace}/{id}:
    get:
      description: Retrieves a blob from the data store
      produces:
      - application/octet-stream
      responses:
        "200":
          description: OK
          schema:
            type: file
      summary: Get blob
      tags:
      - data
  /api/v1/gateway/reputation/sign:
    post:
      consumes:
      - application/json
      description: App mTLS only. Returns an HMAC signature over merkle_root || prev_root
        || tribunal_command_id. The signing key remains in the Gateway keystore. Signing
        does not validate the application's scores or satisfy governance proof requirements.
      parameters:
      - description: Reputation commitment claim
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.ReputationSignRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ReputationSignResponse'
        "400":
          description: Invalid commitment
          schema:
            type: string
        "403":
          description: App identity required
          schema:
            type: string
        "503":
          description: Signing unavailable
          schema:
            type: string
      summary: Sign an application reputation commitment
      tags:
      - gateway
  /api/v1/governance/envelopes:
    post:
      consumes:
      - application/json
      description: |-
        Accepts a GovernanceEnvelope, verifies it through the 5-layer gauntlet (L1–L3 pre-flight,
        L4 warden, L5 actuator), and returns the signed ActionReceipt. Transport-to-envelope
        identity binding is enforced via mTLS certificate URI SAN matching.
      parameters:
      - description: GovernanceEnvelope (protojson)
        in: body
        name: envelope
        required: true
        schema:
          items:
            type: integer
          type: array
      produces:
      - application/json
      responses:
        "200":
          description: Canonical protojson ActionReceipt
          schema:
            $ref: '#/definitions/operatorv1.ActionReceipt'
        "400":
          description: Bad Request — malformed envelope
          schema:
            $ref: '#/definitions/operatorv1.IngressRefusal'
        "403":
          description: Forbidden — IngressRefusal when refused before L4 (identity
            binding, outcome, L3 proof unmintable); GovernanceRejection carrying the
            signed receipt when L4 rejects
          schema:
            $ref: '#/definitions/operatorv1.IngressRefusal'
        "405":
          description: Method Not Allowed
          schema:
            $ref: '#/definitions/operatorv1.IngressRefusal'
        "503":
          description: Service Unavailable — IngressRefusal when the processor is
            not configured; GovernanceRejection carrying the signed receipt when L4
            cannot run
          schema:
            $ref: '#/definitions/operatorv1.IngressRefusal'
      summary: Submit governance envelope
      tags:
      - governance
  /api/v1/inference/dispatch:
    post:
      consumes:
      - application/json
      description: Platform-internal endpoint (mTLS, app workload) that routes an
        inference request through the L1-L5 governance gauntlet to the Inference Node
        and returns the verified result plus final signed receipt.
      parameters:
      - description: Governed inference dispatch request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/operatorv1.InferenceDispatchRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Verified inference result and final signed receipt
          schema:
            $ref: '#/definitions/operatorv1.InferenceDispatchResponse'
        "400":
          description: Bad Request — malformed body, unknown field, missing messages,
            invalid role, or acting_app_id identity mismatch
          schema:
            $ref: '#/definitions/operatorv1.InferenceDispatchFailure'
        "401":
          description: Unauthorized — missing delegated user identity
          schema:
            $ref: '#/definitions/operatorv1.InferenceDispatchFailure'
        "403":
          description: Forbidden — not an app workload, model override denied, or
            governance rejection
          schema:
            $ref: '#/definitions/operatorv1.InferenceDispatchFailure'
        "404":
          description: Not Found — no inference-capable operator session
          schema:
            $ref: '#/definitions/operatorv1.InferenceDispatchFailure'
        "405":
          description: Method Not Allowed
          schema:
            $ref: '#/definitions/operatorv1.InferenceDispatchFailure'
        "409":
          description: Conflict — multiple inference-capable operators; explicit target
            required
          schema:
            $ref: '#/definitions/operatorv1.InferenceDispatchFailure'
        "413":
          description: Request Entity Too Large — body exceeds the payload limit
          schema:
            $ref: '#/definitions/operatorv1.InferenceDispatchFailure'
        "422":
          description: Unprocessable Entity — context overflow, unsupported tools,
            or target operator session is not inference-capable
          schema:
            $ref: '#/definitions/operatorv1.InferenceDispatchFailure'
        "500":
          description: Internal Error
          schema:
            $ref: '#/definitions/operatorv1.InferenceDispatchFailure'
        "502":
          description: Bad Gateway — provider or receipt verification failure
          schema:
            $ref: '#/definitions/operatorv1.InferenceDispatchFailure'
        "503":
          description: Service Unavailable — command delivered to no operator subscribers
          schema:
            $ref: '#/definitions/operatorv1.InferenceDispatchFailure'
        "504":
          description: Gateway Timeout — request deadline exceeded; remote provider
            outcome unknown
          schema:
            $ref: '#/definitions/operatorv1.InferenceDispatchFailure'
      summary: Dispatch a governed inference request
      tags:
      - inference
  /api/v1/inference/model-provenance/attestations/{provider_attempt_id}:
    get:
      description: Returns the canonical model provenance attestation window for one
        provider attempt ID (mTLS owner CLI only).
      parameters:
      - description: Provider attempt ID
        in: path
        name: provider_attempt_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ModelProvenanceResponse'
        "404":
          description: Model provenance evidence not found
          schema:
            type: string
        "405":
          description: Method Not Allowed
          schema:
            type: string
        "503":
          description: Model provenance store unavailable
          schema:
            type: string
      summary: Get model provenance attestation evidence
      tags:
      - inference
  /api/v1/inference/provider-observations/{provider_attempt_id}:
    get:
      description: Returns the canonical provider-boundary observation window and
        durable provider-attempt record for one provider attempt ID (mTLS owner CLI
        only).
      parameters:
      - description: Provider attempt ID
        in: path
        name: provider_attempt_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ProviderObservationResponse'
        "404":
          description: Observation evidence not found
          schema:
            type: string
        "405":
          description: Method Not Allowed
          schema:
            type: string
        "503":
          description: Provider observation store unavailable
          schema:
            type: string
      summary: Get provider-boundary observation evidence
      tags:
      - inference
  /api/v1/observe/bootstrap:
    get:
      description: Returns one bounded initial snapshot for agents, active run, overview
        counters, recent runs, latest eval summaries, and download metadata.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ObserveBootstrapSnapshot'
        "401":
          description: Unauthorized
          schema:
            type: string
      summary: Get observe bootstrap snapshot
      tags:
      - observe
  /api/v1/observe/downloads:
    get:
      description: Returns a paginated list of allowlisted download artifacts owned
        by the authenticated user.
      parameters:
      - description: Pagination cursor
        in: query
        name: cursor
        type: string
      - description: Page size (1-100, default 20)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ObservePage'
        "400":
          description: Invalid cursor or limit
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
      summary: List observe downloads
      tags:
