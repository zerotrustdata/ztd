<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Action receipts grew legs</title>
  <desc id="desc">Two duplicate receipt stores converge into one signed event chain while the redundant receipts table is deleted.</desc>
  <defs>
    <radialGradient id="glow">
      <stop stop-color="#72f6de" stop-opacity=".12"/>
      <stop offset="1" stop-color="#72f6de" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="event" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#24463f"/>
      <stop offset="1" stop-color="#122626"/>
    </linearGradient>
    <linearGradient id="duplicate" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#332321"/>
      <stop offset="1" stop-color="#1d1818"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r=".7" fill="#608d89" opacity=".28"/>
    </pattern>
  </defs>

  <path fill="#0b171a" d="M0 0h560v480H0z"/>
  <path fill="url(#grid)" d="M0 0h560v480H0z"/>
  <circle cx="280" cy="230" r="225" fill="url(#glow)"/>
  <path d="M20 40V20h20M520 20h20v20M20 440v20h20M520 460h20v-20" stroke="#41645f"/>

  <g font-family="monospace" font-size="9" letter-spacing="2" fill="#91b6b0">
    <text x="35" y="49">05 / EVENT RECEIPTS</text>
    <text x="525" y="49" text-anchor="end">ONE SOURCE OF TRUTH</text>
  </g>

  <!-- The accidental second store. -->
  <g transform="translate(42 86)">
    <rect width="190" height="168" rx="8" fill="url(#duplicate)" stroke="#d99b88" stroke-opacity=".78" stroke-dasharray="4 4"/>
    <path d="M0 32h190" stroke="#d99b88" stroke-opacity=".35"/>
    <circle cx="16" cy="16" r="3" fill="#d99b88"/>
    <circle cx="27" cy="16" r="3" fill="#725951"/>
    <text x="176" y="20" text-anchor="end" font-family="monospace" font-size="8" letter-spacing="1.2" fill="#e5b19c">receipts TABLE</text>
    <g font-family="monospace" font-size="8" fill="#b69c8d">
      <text x="16" y="55">action_receipt_1042</text>
      <text x="16" y="82">action_receipt_1043</text>
      <text x="16" y="109">action_receipt_1044</text>
      <text x="16" y="136">action_receipt_1045</text>
    </g>
    <g stroke="#886f66" stroke-dasharray="3 4">
      <path d="M16 63h158M16 90h158M16 117h158M16 144h158"/>
    </g>
    <circle cx="164" cy="135" r="15" fill="#2d2524" stroke="#d99b88" stroke-opacity=".65"/>
    <path d="m158 129 12 12m0-12-12 12" stroke="#f0b39d" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- The canonical signed event chain. -->
  <g transform="translate(328 86)">
    <rect width="190" height="168" rx="8" fill="url(#event)" stroke="#72f6de" stroke-opacity=".78"/>
    <path d="M0 32h190" stroke="#72f6de" stroke-opacity=".22"/>
    <circle cx="16" cy="16" r="3" fill="#72f6de"/>
    <circle cx="27" cy="16" r="3" fill="#436c68"/>
    <text x="176" y="20" text-anchor="end" font-family="monospace" font-size="8" letter-spacing="1.2" fill="#a9e5d8">events CHAIN</text>
    <g fill="#102421" stroke="#72f6de" stroke-opacity=".62">
      <rect x="16" y="48" width="158" height="22" rx="4"/>
      <rect x="16" y="82" width="158" height="22" rx="4"/>
      <rect x="16" y="116" width="158" height="22" rx="4"/>
    </g>
    <g font-family="monospace" font-size="8" fill="#c8fff1">
      <text x="27" y="63">EXECUTING</text>
      <text x="27" y="97">COMPLETED</text>
      <text x="27" y="131">SIGNED PROJECTION</text>
    </g>
    <g fill="#72f6de">
      <circle cx="158" cy="59" r="3"/>
      <circle cx="158" cy="93" r="3"/>
      <circle cx="158" cy="127" r="3"/>
    </g>
    <path d="M158 62v17m0 17v17" stroke="#72f6de" stroke-opacity=".7"/>
  </g>

  <!-- Delete the duplicate noun, preserve the evidence. -->
  <path d="M232 170h77m-8-7 8 7-8 7" stroke="#72f6de" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="248" y="151" width="43" height="38" rx="7" fill="#102421" stroke="#436c68"/>
  <path d="M261 162h17m-15 0 2 16h10l2-16m-11-4h8" stroke="#a9e5d8" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="101" y="285" width="358" height="46" rx="7" fill="#0f2021" stroke="#345d54"/>
  <text x="280" y="303" text-anchor="middle" font-family="monospace" font-size="8" letter-spacing="1.4" fill="#789e96">DUPLICATE REPRESENTATION REMOVED</text>
  <text x="280" y="320" text-anchor="middle" font-family="monospace" font-size="11" letter-spacing="1.1" fill="#c8fff1">ONE EVENT CHAIN / ONE RECEIPT MODEL</text>

  <!-- Database footprint before and after. -->
  <g transform="translate(104 365)">
    <path d="M0 8c0-4 31-8 69-8s69 4 69 8v42c0 4-31 8-69 8S0 54 0 50Z" fill="#251b1a" stroke="#d99b88" stroke-opacity=".7"/>
    <ellipse cx="69" cy="8" rx="69" ry="8" fill="#332321" stroke="#d99b88" stroke-opacity=".7"/>
    <path d="M0 29c0 4 31 8 69 8s69-4 69-8" stroke="#886f66"/>
    <text x="69" y="32" text-anchor="middle" font-family="monospace" font-size="9" fill="#e5b19c">2&#215; RECEIPTS</text>
  </g>
  <path d="M254 394h51m-7-6 7 6-7 6" stroke="#72f6de" stroke-linecap="round" stroke-linejoin="round"/>
  <g transform="translate(318 377)">
    <path d="M0 7c0-4 31-7 69-7s69 3 69 7v30c0 4-31 7-69 7S0 41 0 37Z" fill="#123029" stroke="#72f6de" stroke-opacity=".72"/>
    <ellipse cx="69" cy="7" rx="69" ry="7" fill="#1c443a" stroke="#72f6de" stroke-opacity=".72"/>
    <text x="69" y="29" text-anchor="middle" font-family="monospace" font-size="9" fill="#a9e5d8">~&#189; DATABASE</text>
  </g>
</svg>
