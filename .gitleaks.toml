title = "ztd custom gitleaks config"

[extend]
useDefault = true

[[allowlists]]
description = "Skip vendored dependencies"
paths = [
  '''vendor/.*''',
]

[[allowlists]]
description = "Skip all test files (Go, JS; Python patterns cover removed ensemble/protocol-python history scanned by CI)"
paths = [
  '''.*_test\.go''',
  '''.*_test\.py''',
  '''.*/test_.+\.py''',
  '''.*/tests/.*''',
  '''.*/test/.*''',
]

[[allowlists]]
description = "Skip documentation and protocol constants"
paths = [
  '''docs/.*''',
  '''README\.md''',
  '''protocol/constants/.*''',
  '''internal/constants/.*''',
  '''console/src/generated/.*''',
  '''scripts/.*''',
]

[[allowlists]]
description = "Skip historical components directory (submodule remnants)"
paths = [
  '''components/.*''',
]

[[allowlists]]
description = "Historical dashboard settings registry: ztd_internal_*_url keys are setting names whose defaults are in-cluster URLs, not credentials"
condition = "AND"
paths = [
  '''dashboard/models/settings_model\.js''',
]
regexes = [
  '''^ztd_internal_[a-z_]+_url$''',
]

[[allowlists]]
description = "Skip historical services directory (env var constants, not secrets)"
paths = [
  '''services/.*''',
]

[[allowlists]]
description = "Skip historical python protocol env var constants"
paths = [
  '''protocol/python/ztd_protocol/.*''',
]

[[allowlists]]
description = "Skip demo SSH keys and profiles"
paths = [
  '''demo/profiles/.*''',
]

[[allowlists]]
description = "Skip known false-positive constant names"
regexes = [
  '''X-ZTD-Operator-API-Key''',
  '''OPERATOR_API_KEY_HEADER''',
  '''envZTDOperatorID''',
  '''envZTDUserID''',
  '''BCRYPT_.*KEY_BLOB.*''',
  '''NCRYPT_PKCS8_PRIVATE_KEY_BLOB''',
  '''DHPRIVKEY_VER3''',
  '''T_BCRYPT_DSA_KEY_BLOB_V2''',
  '''TPBCRYPT_DSA_KEY_BLOB_V2''',
  '''TBCRYPT_DSA_KEY_BLOB_V2''',
  '''szOID_CERT_STRONG_KEY_OS_1''',
  '''Rfc3565KeyWrapBlob''',
]

[[allowlists]]
description = "Skip test log fixtures with fake api keys"
paths = [
  '''internal/services/mcp/search_file_test\.go''',
  '''internal/services/mcp/native_handlers_test\.go''',
  '''internal/cli/cmd/mcp_test\.go''',
  '''internal/services/gateway/auth_bootstrap_test\.go''',
  '''services/ztdo/internal/services/auth/bootstrap_test\.go''',
]

[[allowlists]]
description = "Skip WebAuthn authenticator data in test fixtures"
paths = [
  '''internal/services/gateway/auth_.*test\.go''',
  '''test/.*''',
]

[[allowlists]]
description = "Skip demo/test private keys"
paths = [
  '''internal/services/gateway/pki/.*''',
  '''demos/.*/config/.*''',
]

[[allowlists]]
description = "Historical removed ensemble: env var name constants and empty .env.example template (names, not secret values; kept for full-history scans)"
paths = [
  '''ensemble/app/constants/env_vars\.py''',
  '''ensemble/\.env\.example''',
]

[[allowlists]]
description = "Historical removed ensemble: evaluation gold-set fixture keys (task IDs, not credentials; kept for full-history scans)"
paths = [
  '''ensemble/evals/gold_sets/.*''',
]

[[allowlists]]
description = "Skip evaluation explorer mock fixture data"
paths = [
  '''evaluation-explorer/src/fixtures/.*''',
]
