#
# Job order:
#   validate  -> preflight: tag/VERSION/revision agreement, dispatch ref rules
#   credentials -> write/read/delete a probe in the real R2 bucket with the publish
#                credential, so a revoked or under-scoped Cloudflare token fails
#                before anything is built or published; fix it and rerun
#   build     -> build-all, checksums, prepublication artifact verification,
#                cosign keyless signing (.sigstore.json bundles), staged release set
#   verify-download -> execute the real publication procedure against a temporary
#                GitHub draft and an isolated prefix in the real R2 bucket;
#                verify downloaded bytes and clean up, without public publication
#   publish   -> (publish=true only) re-verify the downloaded set, GitHub draft
#                release, immutable R2 upload under v<VERSION>/ (wrangler), release
#                published, then promote R2 latest.json (the single website
#                promotion step)
#   verify-install -> POSTPUBLICATION gate: fresh `go install` from the public module
#
# workflow_dispatch: a run from a release tag (refs/tags/v<VERSION>) may publish.
# A run from a branch is a rehearsal and must keep publish=false.

name: Release Binary

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Create the GitHub release, upload to R2, and publish the release. Requires a release tag ref. Leave false to build, sign, and verify only.'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-binary-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Release Inputs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.preflight.outputs.version }}
      publish: ${{ steps.preflight.outputs.publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Preflight
        id: preflight
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          PUBLISH_INPUT: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          scripts/release-preflight.sh \
            --event "$EVENT_NAME" \
            --ref "$REF" \
            --sha "$SHA" \
            --publish "${PUBLISH_INPUT:-false}" >> "$GITHUB_OUTPUT"

  credentials:
    name: Verify Publish Credentials
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install wrangler
        run: npm ci --prefix website

      # Repository-level secrets, the same ones publish reads: the release
      # environment admits only v* tags, so an environment-scoped copy would be
      # invisible to rehearsals and could drift from what they verified.
      - name: Check R2 publish credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_ACCOUNT_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: scripts/release-r2.sh check

  build:
    name: Build, Sign, and Verify
    needs: [validate, credentials]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify install package path
        run: |
          set -euo pipefail
          test "$(go list -m -f '{{.Path}}')" = "github.com/zerotrustdata/ztd"
          GOBIN="$RUNNER_TEMP/ztd-gobin" go install ./cmd/ztd
          test -x "$RUNNER_TEMP/ztd-gobin/ztd"

      - name: Build all platforms
        run: make build-all SOURCE_REVISION="$(git rev-parse HEAD)"

      - name: Generate checksums and verify unsigned artifacts
        run: |
          set -euo pipefail
          scripts/release-artifacts.sh checksums bin
          scripts/release-artifacts.sh verify bin "$VERSION" "$(git rev-parse HEAD)"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign and verify binaries
        run: scripts/release-artifacts.sh sign bin

      - name: Stage and verify release set
        run: |
          set -euo pipefail
          scripts/release-artifacts.sh stage bin release
          scripts/release-artifacts.sh verify release "$VERSION" "$(git rev-parse HEAD)"
          scripts/release-artifacts.sh verify-signatures release

      - name: Upload release set
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-set
          path: release/
          if-no-files-found: error

  verify-download:
    name: Verify Downloaded Release Set
    needs: [validate, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download release set
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-set
          path: release

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install wrangler
        run: npm ci --prefix website

      - name: Test the publication procedure without publishing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_ACCOUNT_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: scripts/release-publish.sh rehearse release "$VERSION" "$(git rev-parse HEAD)"

  publish:
    name: Publish Release
    needs: [validate, build, verify-download]
    if: needs.validate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download release set
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-set
          path: release

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install wrangler
        run: npm ci --prefix website

      - name: Publish and verify the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_ACCOUNT_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: scripts/release-publish.sh publish release "$VERSION" "$(git rev-parse HEAD)"

  verify-install:
    # POSTPUBLICATION gate: runs only after the release is public.
    name: Verify Go Install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [validate, publish]
    if: needs.validate.outputs.publish == 'true'
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Fresh go install from the public module path
        run: |
          set -euo pipefail
          go install "github.com/zerotrustdata/ztd/cmd/ztd@v${VERSION}"
          # go install does not apply release ldflags, so `ztd version` reports the dev
          # constant. Check the installed module path and version from Go build info.
          BIN_DIR="$(go env GOBIN)"
          [ -n "$BIN_DIR" ] || BIN_DIR="$(go env GOPATH)/bin"
          EXT=""
          if [ "$RUNNER_OS" = "Windows" ]; then EXT=".exe"; fi
          BIN="$BIN_DIR/ztd$EXT"
          test -x "$BIN"
          go version -m "$BIN" | awk -v v="v${VERSION}" '
            $1 == "path" && $2 == "github.com/zerotrustdata/ztd/cmd/ztd" { path_ok = 1 }
            $1 == "mod" && $2 == "github.com/zerotrustdata/ztd" && $3 == v { mod_ok = 1 }
            END { exit !(path_ok && mod_ok) }'
          "$BIN" --help >/dev/null
          echo "Fresh go install verified successfully (github.com/zerotrustdata/ztd/cmd/ztd v${VERSION})"
