name: Deploy zerotrustdata.io

on:
  push:
    branches: [main]
    paths:
      - README.md
      - docs/release_notes/**
      - website/**
      - .github/workflows/deploy-website.yml
  pull_request:
    paths:
      - README.md
      - docs/release_notes/**
      - website/**
      - .github/workflows/deploy-website.yml
  workflow_dispatch:

concurrency:
  group: website-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: website
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test and build
        run: npm run check && npm run build

  deploy:
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://zerotrustdata.io
    defaults:
      run:
        working-directory: website
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Deploy
        id: deploy
        shell: bash
        run: |
          version_id=$(npx wrangler deploy | tee /dev/stderr | sed -n 's/^Current Version ID: //p')
          [ -n "$version_id" ] || { echo "wrangler deploy did not report a version ID" >&2; exit 1; }
          echo "version_id=$version_id" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_ACCOUNT_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Releases pages, then the published one-command onboarding run end to end on the runner.
      - name: Smoke test the live site
        run: sh smoke/live.sh
        env:
          ZTD_SMOKE_WORKER_VERSION: ${{ steps.deploy.outputs.version_id }}
