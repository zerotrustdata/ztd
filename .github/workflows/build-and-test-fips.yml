name: CI (FIPS 140-3)

# FIPS 140-3 build verification.
# Builds ztd with GOFIPS140=v1.0.0 (linking the Go Cryptographic Module,
# CMVP Cert #5247) and runs the `ztd version --fips` self-check to verify
# approved mode and enforcement via the native crypto/fips140 API.
# Full platform suites run locally rather than repeating in this job.
#
# The FIPS compliance claim is restricted to linux/amd64 (the tested OE).
# See docs/reference/fips140-3.md.

on:
  push:
    branches: [ main ]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'vendor/**'
      - 'Makefile'
      - '.github/workflows/build-and-test-fips.yml'
  pull_request:
    branches: [ main ]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'vendor/**'
      - 'Makefile'
      - '.github/workflows/build-and-test-fips.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fips:
    name: FIPS 140-3 Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          check-latest: true

      - name: Build FIPS variant and run self-check
        run: make fips-verify

      - name: Verify Static Linking (FIPS binary)
        run: make verify-static STATIC_BINARY=bin/ztd-fips-linux-amd64
