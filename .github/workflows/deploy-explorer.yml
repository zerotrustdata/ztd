name: Deploy opendevops.ai Explorer

on:
  push:
    branches: [main]
    paths:
      - evaluation-explorer/**
      - ztd-adapter/**
      - .github/workflows/deploy-explorer.yml
  pull_request:
    paths:
      - evaluation-explorer/**
      - ztd-adapter/**
      - .github/workflows/deploy-explorer.yml
  workflow_dispatch:

concurrency:
  group: explorer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: evaluation-explorer
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: evaluation-explorer/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build production dist
        run: npm run build:production

  deploy:
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://next.opendevops.ai
    defaults:
      run:
        working-directory: evaluation-explorer
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: evaluation-explorer/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build production dist
        run: npm run build:production
      - name: Deploy
        run: npx --yes wrangler@4.156.0 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_ACCOUNT_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
