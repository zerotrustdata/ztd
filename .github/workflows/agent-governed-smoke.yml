name: Agent governed smoke

# CPU-only local-model check. It downloads Ollama and qwen2.5:0.5b, so it is
# not on the pull-request path. Run it with workflow_dispatch.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agent-governed-smoke:
    name: Governed agent smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install zstd
        run: sudo apt-get update && sudo apt-get install -y zstd

      - name: Run the governed agent smoke
        env:
          ZTD_SMOKE_ARTIFACTS: ${{ runner.temp }}/ztd-agent-governed-smoke
        run: make test-agent-smoke

      - name: Preserve agent smoke evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-governed-smoke
          path: ${{ runner.temp }}/ztd-agent-governed-smoke/
          if-no-files-found: ignore
